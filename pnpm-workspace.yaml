allowBuilds:
  '@prisma/engines': true
  # false: scarf é só telemetria de instalação (dep transitiva do swagger-ui-dist).
  # Não precisa rodar postinstall; declarado aqui pra o pnpm não tratar o "ignored
  # build script" como erro no CI (--frozen-lockfile sai 1).
  '@scarf/scarf': false
  # true: o upload de source map (withSentryConfig) roda pelo binario do
  # sentry-cli, que so existe se o postinstall dele puder baixar. Sem isto o
  # build nao des-minifica stack trace nenhum.
  '@sentry/cli': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
