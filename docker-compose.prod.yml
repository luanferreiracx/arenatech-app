name: arenatech-prod

services:
  app:
    # Imagem pre-buildada no GHA + publicada no GHCR.
    # CI/CD aplica override docker-compose.deploy.yml com image atualizado.
    # Build local ainda funciona via `docker compose build app`.
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/luanferreiracx/arenatech-app:latest
    pull_policy: always
    container_name: arenatech-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Auditoria 2026-08-05 (P1-B3): postgres e redis tinham healthcheck, o app
    # NÃO — justamente o container que serve todos os clientes. `restart:
    # unless-stopped` só age em processo MORTO; um app pendurado (event loop
    # travado, pool esgotado) fica de pé sem servir e ninguém descobre.
    #
    # `start_period` de 40s: o Next standalone leva alguns segundos para atender,
    # e falha durante o boot não conta como unhealthy.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - arenatech

  postgres:
    image: postgres:16-alpine
    container_name: arenatech-postgres-prod
    restart: unless-stopped
    # `pg_stat_statements` mede QUAL query custa caro em produção, com dados e
    # concorrência reais. Sem ele, otimizar é adivinhação: `EXPLAIN` responde
    # sobre a query que você já suspeita, e o gargalo real costuma ser uma que
    # ninguém olhou — barata sozinha, executada dez mil vezes.
    #
    # Precisa de `shared_preload_libraries` (carrega no start do servidor, não dá
    # para ligar com `CREATE EXTENSION` sozinho) — daí exigir restart. `command`
    # aqui SOBRESCREVE o CMD da imagem, mas o entrypoint oficial continua sendo
    # executado: ele recebe estes argumentos e os repassa ao postgres. Por isso o
    # primeiro item TEM que ser `postgres` — sem ele o entrypoint não reconhece o
    # comando como "subir o servidor" e o container vira um no-op.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      # `top` (padrão): agrega comandos aninhados de função/trigger no comando de
      # topo, em vez de registrar cada statement interno. Mantém a lista legível.
      - -c
      - pg_stat_statements.track=top
      # 5000 queries distintas guardadas. O padrão também é 5000; explícito aqui
      # para o número ser uma decisão visível e não um efeito colateral do
      # default. Cada entrada custa ~1KB de memória compartilhada.
      - -c
      - pg_stat_statements.max=5000
      # Persiste as estatísticas no shutdown e recarrega no start. Sem isto, todo
      # restart zera o histórico — e a pergunta que este módulo existe para
      # responder ("o que custou caro nas últimas semanas") não sobreviveria a um
      # deploy.
      - -c
      - pg_stat_statements.save=on
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenatech"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arenatech

  redis:
    image: redis:7-alpine
    container_name: arenatech-redis-prod
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_prod_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arenatech

  minio:
    image: minio/minio:latest
    container_name: arenatech-minio-prod
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_prod_data:/data
    command: server /data --console-address ":9001"
    networks:
      - arenatech

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  arenatech:
    driver: bridge
    # IPv6 habilitado: a API CheckIMEI aceita IPv6 e rejeita IPv4 ("Wrong IP").
    # Sem isso, o container so tem egress IPv4 e a consulta de IMEI falha.
    # NAT66 (gateway_mode_ipv6=nat) mascara p/ o IPv6 global do host.
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv6: nat
    ipam:
      config:
        - subnet: fd00:a2e:a7ec::/64
