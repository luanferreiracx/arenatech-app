# Catálogo multi-tenant por subdomínio: <slug>.pdvdepix.app.
# Reusa o cert de pdvdepix.app (Cloudflare "Full" termina o TLS do visitante com
# o Universal SSL que cobre *.pdvdepix.app; a origem só precisa de UM cert válido).
# Aditivo: não altera os hosts existentes.
server {
    server_name ~^(?<sub>[a-z0-9-]+)\.pdvdepix\.app$;

    client_max_body_size 50M;
    access_log /var/log/nginx/pdvdepix-wildcard-access.log;
    error_log /var/log/nginx/pdvdepix-wildcard-error.log;

    # Security headers (auditoria 2026-08-05, P1-B2) — mesmo conjunto do vhost
    # principal. O wildcard serve os catalogos publicos por subdominio.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/pdvdepix.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdvdepix.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<sub>[a-z0-9-]+)\.pdvdepix\.app$;
    return 301 https://$host$request_uri;
}
